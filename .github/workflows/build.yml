name: build-course-vm

# Builds the amd64 image on an x86 runner (which has /dev/kvm, so the build runs
# at native speed and finishes in ~25 min). Trigger manually.
#
# arm64 is intentionally NOT built here: GitHub's hosted arm64 runners do not
# expose /dev/kvm, so a Packer/QEMU build there would fall back to slow TCG
# emulation. Build arm64 locally on an Apple Silicon Mac instead -- `make arm64`
# uses hvf and is fast (see README).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU + Packer
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install -y packer

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules || true
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 0666 /dev/kvm || true

      - name: Fetch ISO
        # Replace Packer's one-shot downloader with a retrying curl, and verify
        # with a locally computed checksum, so a transient TLS/network blip on
        # the Ubuntu mirror does not fail the build.
        run: |
          curl -fL --retry 8 --retry-all-errors --retry-delay 5 -C - \
            -o "$RUNNER_TEMP/course.iso" \
            "https://releases.ubuntu.com/26.04/ubuntu-26.04-live-server-amd64.iso"
          echo "ISO_PATH=$RUNNER_TEMP/course.iso" >> "$GITHUB_ENV"
          echo "ISO_SHA=sha256:$(sha256sum "$RUNNER_TEMP/course.iso" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Preflight
        run: |
          ls -l /dev/kvm || echo "no /dev/kvm"
          ls -lh "$ISO_PATH"
          qemu-system-x86_64 --version | head -1

      - name: Build amd64
        env:
          PACKER_LOG: "1"
        run: |
          packer init .
          packer build \
            -only="course.qemu.amd64" \
            -var "accel_amd64=kvm" \
            -var "iso_url_amd64=${ISO_PATH}" \
            -var "iso_checksum_amd64=${ISO_SHA}" \
            .

      - uses: actions/upload-artifact@v4
        with:
          name: course-vm-amd64
          path: output/amd64/*
